name: Local benchmark checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y python3.10-venv bubblewrap curl
      # The tool sandbox exposes /usr; use its Python rather than /opt toolcache.
      - run: env PATH=/usr/bin:/bin bash scripts/install_environment.sh
      - run: .runtime/venv/bin/python -m unittest discover -s tests -v
      - run: .runtime/venv/bin/python scripts/gold_selftest.py
      - run: .runtime/venv/bin/python scripts/reproduce_history.py --output results/history
