name: Local benchmark checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap curl
      - run: bash scripts/install_environment.sh
      - run: .runtime/venv/bin/python -m unittest discover -s tests -v
      - run: .runtime/venv/bin/python scripts/gold_selftest.py
      - run: .runtime/venv/bin/python scripts/reproduce_history.py --output results/history
